org.gradle.jvmargs=-Xmx3G -XX:ActiveProcessorCount=2
org.gradle.daemon=false
org.gradle.parallel=false

# NeoForge / Minecraft target
neo_version=21.1.264
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

# MTR compatibility. The adapter compiles against MTR, so a jar is always needed: a jar in
# run/mods is used first, otherwise this Modrinth coordinate is downloaded. Empty = same as
# unset, which falls back to the default below in build.gradle.
mtr_version=4.1.0-beta.2+1.21.1
