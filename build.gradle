plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.sora.splineroads'
version = '1.21.1-2.1.0-1'
base { archivesName = 'splineroads' }

// Target Java 21 bytecode without requiring a locally provisioned JDK 21 toolchain.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.add '--nogui'
        }
        configureEach {
            gameDirectory = project.file(project.findProperty('roadRunDir') ?: 'run')
            systemProperty 'neoforge.enabledCompressibilityCheck', 'false'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        splineroads {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    // The railway adapter compiles against MTR 4.1.x, so a jar is always required; that is the
    // same constraint the 1.20.1 build has. Nothing from MTR is bundled and every MTR type sits
    // behind the version gate in MtrRailAccess.
    // Resolution order: local jar in run/mods (offline friendly) -> mtr_version Modrinth coordinate.
    def mtrJars = fileTree(dir: 'run/mods', include: ['*MTR-neoforge-*.jar'])
    def mtrCoordinate = project.findProperty('mtr_version') ?: '4.1.0-beta.2+1.21.1'
    if (!mtrJars.isEmpty()) {
        compileOnly mtrJars
    } else {
        compileOnly "maven.modrinth:minecraft-transit-railway:${mtrCoordinate}"
    }
}

// Legacy 1.20.1 artifacts kept on disk for reference only; never packaged.
tasks.named('processResources', ProcessResources) {
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/coremods.json'
    exclude 'coremods/**'
    exclude 'data/splineroads/recipes/**'
    exclude 'data/splineroads/loot_tables/**'
    exclude 'data/minecraft/tags/blocks/**'
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE.txt' } }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('THIRD_PARTY_LICENSES') { into 'META-INF/licenses' }
}

tasks.named('jar', Jar) {
    manifest { attributes 'Implementation-Version': project.version }
    manifest { attributes 'Implementation-Vendor': 'BlueStarrySky (1.21.1 NeoForge port)' }
}
